<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cafelytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    <style>
/* Make navbar narrower than normal container */
nav{
  max-width: 900px;  /* decrease width, adjust as needed */
  margin: 0 auto;    /* center it */
}
</style>
  </style>
  </head>
<body>
<div class="container d-flex justify-content-end align-items-center" style="padding: 12px 0;">
  
  <div style="color: green;">
    {% if user.is_authenticated %}
      <span class="me-2">Hi {{ user.get_short_name|default:user.username }}</span>
      <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-secondary">Logout</a>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-sm btn-outline-primary" style="color: green;">Login</a>
    {% endif %}
  </div>
</div>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>
</body>
</html>
